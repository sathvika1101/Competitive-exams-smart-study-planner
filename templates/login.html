
<!DOCTYPE html>
<html>
<head>
    <title>Login - Study Planner</title>
</head>
<body>
    <h2>Competitive Exam Study Planner</h2>
    <h3>Login</h3>

    <form method="POST">
        <label>Email:</label>
        <input type="email" name="email" required>
        <br><br>

        <label>Password:</label>
        <input type="password" name="password" required>
        <br><br>

        <button type="submit">Login</button>
    </form>
</body>
</html>
